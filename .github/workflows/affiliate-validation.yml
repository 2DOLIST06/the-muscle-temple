name: Affiliate validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:1
      NEXT_PUBLIC_CMS_API_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test test/admin-request-origin.test.mjs
      - run: npm run typecheck
      - run: npm run build
